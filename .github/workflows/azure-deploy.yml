name: Deploy Streamlit dashboard to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name   # <-- change to your Azure Web App name
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Smoke test (imports + data load)
        run: |
          pip install -r requirements.txt
          python -c "import pandas as pd; print(len(pd.read_csv('data/encounters.csv')))"

      - name: Zip the app (Azure installs requirements on its side)
        run: zip -r release.zip . -x ".git/*" ".github/*" "*.pyc" "__pycache__/*"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Unzip
        run: unzip -q release.zip && rm release.zip

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
